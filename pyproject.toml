[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linecat"
version = "0.10.1"
description = "Line Catalog Explorer: filter CDMS spectral line catalogs and draw energy-level diagrams"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vahid Anari", email = "vahid.anari8@gmail.com" }]
requires-python = ">=3.10"
keywords = ["spectroscopy", "CDMS", "line catalog", "molecular lines", "energy-level diagram", "astronomy", "PySide6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PySide6>=6.5",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "sciwidgets[table]~=0.10.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "build", "twine"]

[project.scripts]
linecat = "linecat.main:main"

[project.urls]
Homepage = "https://github.com/vahid-anari/linecat"
Source = "https://github.com/vahid-anari/linecat"
Issues = "https://github.com/vahid-anari/linecat/issues"
Changelog = "https://github.com/vahid-anari/linecat/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linecat = ["data/*.pdf", "data/molecules/*/*.cat", "data/molecules/*/*.pdf", "data/molecules/*/*.svg", "data/docs/*.pdf", "data/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
